<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Illustration of a small research-station cafe on stilts in the snow">
  <defs>
    <linearGradient id="st-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1a25"/>
      <stop offset="100%" stop-color="#1b3a48"/>
    </linearGradient>
    <linearGradient id="st-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4f0f5"/>
      <stop offset="100%" stop-color="#a9c6d2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#st-sky)"/>
  <g fill="#eaf4f8" opacity=".7">
    <circle cx="90" cy="70" r="1.6"/><circle cx="240" cy="120" r="1.1"/><circle cx="410" cy="60" r="1.4"/>
    <circle cx="560" cy="130" r="1.2"/><circle cx="700" cy="80" r="1.5"/><circle cx="640" cy="220" r="1"/>
    <circle cx="150" cy="200" r="1"/><circle cx="330" cy="240" r="1.1"/>
  </g>
  <!-- moon -->
  <circle cx="660" cy="120" r="34" fill="#f2f7f9" opacity=".18"/>
  <!-- ridge -->
  <path d="M0 380 L140 320 L260 370 L400 300 L540 380 L680 330 L800 385 L800 560 L0 560 Z" fill="#2c4d5e" opacity=".7"/>
  <!-- snow field -->
  <path d="M0 430 L180 400 L360 435 L560 395 L800 440 L800 560 L0 560 Z" fill="url(#st-snow)"/>

  <!-- cabin on stilts -->
  <g>
    <rect x="330" y="415" width="10" height="60" fill="#3a2c22"/>
    <rect x="470" y="415" width="10" height="60" fill="#3a2c22"/>
    <rect x="310" y="330" width="190" height="90" rx="6" fill="#20323d" stroke="#8fb0bd" stroke-width="2"/>
    <path d="M296 332 L405 276 L514 332 Z" fill="#16262f" stroke="#8fb0bd" stroke-width="2" stroke-linejoin="round"/>
    <!-- warm windows -->
    <rect x="332" y="352" width="46" height="34" rx="3" fill="#e8b968" opacity=".92"/>
    <rect x="396" y="352" width="46" height="34" rx="3" fill="#e8b968" opacity=".92"/>
    <rect x="460" y="352" width="24" height="34" rx="3" fill="#e8b968" opacity=".7"/>
    <!-- chimney + smoke -->
    <rect x="466" y="286" width="14" height="30" fill="#3a2c22"/>
    <path d="M473 282 C 462 262, 492 254, 480 234 C 470 216, 496 208, 488 190" fill="none" stroke="#cfe2ea" stroke-width="3" opacity=".35" stroke-linecap="round"/>
  </g>
  <!-- warm light pool -->
  <ellipse cx="405" cy="482" rx="150" ry="18" fill="#e8b968" opacity=".14"/>
  <!-- path markers -->
  <g stroke="#4d6f80" stroke-width="3" stroke-linecap="round">
    <path d="M180 500 L180 478"/><path d="M255 522 L255 498"/><path d="M120 480 L120 462"/>
  </g>
</svg>
