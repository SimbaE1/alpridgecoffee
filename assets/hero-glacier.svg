<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of an aurora above a glacier ridge">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08131c"/>
      <stop offset="55%" stop-color="#0e2130"/>
      <stop offset="100%" stop-color="#16323f"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fd6c0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5fe0c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7aa8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9d7cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8fb7ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4fd6c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ice1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfeef4"/>
      <stop offset="100%" stop-color="#93b6c6"/>
    </linearGradient>
    <linearGradient id="ice2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9d4de"/>
      <stop offset="100%" stop-color="#5d8397"/>
    </linearGradient>
    <linearGradient id="ice3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ea3b4"/>
      <stop offset="100%" stop-color="#33566a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#eaf4f8">
    <circle cx="120" cy="90" r="1.6" opacity=".8"/><circle cx="300" cy="150" r="1.1" opacity=".5"/>
    <circle cx="470" cy="70" r="1.4" opacity=".7"/><circle cx="640" cy="180" r="1" opacity=".45"/>
    <circle cx="820" cy="60" r="1.7" opacity=".85"/><circle cx="980" cy="140" r="1.2" opacity=".55"/>
    <circle cx="1150" cy="80" r="1.5" opacity=".7"/><circle cx="1320" cy="170" r="1.1" opacity=".5"/>
    <circle cx="1470" cy="100" r="1.6" opacity=".8"/><circle cx="1550" cy="240" r="1" opacity=".4"/>
    <circle cx="210" cy="260" r="1" opacity=".4"/><circle cx="720" cy="300" r="1.2" opacity=".35"/>
    <circle cx="1040" cy="270" r="1" opacity=".4"/><circle cx="380" cy="330" r="1.1" opacity=".3"/>
  </g>

  <!-- aurora bands -->
  <g filter="url(#soft)">
    <path d="M-100 320 C 260 180, 520 400, 820 250 S 1360 180, 1720 300 L1720 470 C1360 350, 1100 520, 820 420 S 260 350, -100 490 Z" fill="url(#aurora)"/>
    <path d="M-100 430 C 320 330, 560 520, 900 400 S 1420 330, 1720 430 L1720 520 C1420 430, 1180 600, 900 500 S 320 430, -100 540 Z" fill="url(#aurora2)"/>
  </g>

  <!-- distant ridge -->
  <path d="M0 640 L180 520 L300 600 L430 470 L560 610 L700 520 L860 640 L1000 560 L1150 480 L1300 620 L1450 540 L1600 630 L1600 900 L0 900 Z" fill="#33566a" opacity=".55"/>
  <!-- mid ridge -->
  <path d="M0 720 L160 640 L280 700 L470 570 L640 700 L780 640 L940 730 L1120 620 L1290 720 L1440 660 L1600 730 L1600 900 L0 900 Z" fill="url(#ice2)" opacity=".85"/>
  <!-- front glacier -->
  <path d="M0 800 L240 720 L420 790 L620 700 L840 800 L1060 730 L1280 810 L1460 750 L1600 800 L1600 900 L0 900 Z" fill="url(#ice1)"/>
  <!-- crevasse lines -->
  <g stroke="#6f95a8" stroke-width="2" opacity=".35" fill="none">
    <path d="M240 720 L300 900"/><path d="M620 700 L560 900"/><path d="M1060 730 L1120 900"/><path d="M1460 750 L1400 900"/>
  </g>
</svg>
